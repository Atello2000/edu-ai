# CI Jangalai — tests unitaires (mocks) + intégration contre un vrai PostgreSQL.
# Le service postgres éphémère active la suite tests/integration.pg.test.js
# (skippée en local pour ne jamais toucher la base Neon de production).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jangalai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      SESSION_SECRET: ci-session-secret-minimum-32-chars!
      CSRF_SECRET: ci-csrf-secret-minimum-32-characters
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jangalai_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jangalai_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests (unit + integration)
        run: npx jest --runInBand
