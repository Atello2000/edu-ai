<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Jangalai — Révisez plus intelligemment</title>
    <meta name="description" content="Chargez vos cours PDF ou PowerPoint — l'IA génère résumés, quiz, flashcards et répond à toutes vos questions en quelques secondes." />
    <meta name="theme-color" content="#070b14" />
    <link rel="canonical" href="https://jangalai.online" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Jangalai" />
    <meta property="og:locale"      content="fr_SN" />
    <meta property="og:title"       content="Jangalai — Révisez plus intelligemment" />
    <meta property="og:description" content="Chargez vos cours PDF ou PPT. En quelques secondes, Jangalai génère résumé, quiz, flashcards et carte mentale." />
    <meta property="og:url"         content="https://jangalai.online" />
    <meta property="og:image"       content="https://jangalai.online/og-image.jpg" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"    content="Jangalai — transformez vos cours en outils de révision IA" />

    <!-- Twitter -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Jangalai — Révisez plus intelligemment" />
    <meta name="twitter:description" content="L'assistant IA qui transforme vos cours en outils de révision en quelques secondes." />
    <meta name="twitter:image"       content="https://jangalai.online/og-image.jpg" />
    <meta name="twitter:image:alt"   content="Jangalai — transformez vos cours en outils de révision IA" />

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Jangalai",
      "url": "https://jangalai.online",
      "description": "Plateforme IA qui transforme vos cours PDF/PPT en résumés, quiz, flashcards, cartes mentales et plans de révision.",
      "applicationCategory": "EducationApplication",
      "operatingSystem": "Web",
      "inLanguage": ["fr", "en", "ar"],
      "audience": {
        "@type": "EducationalAudience",
        "educationalRole": "student"
      },
      "offers": [
        { "@type": "Offer", "name": "Free",  "price": "0",    "priceCurrency": "XOF" },
        { "@type": "Offer", "name": "Pro",   "price": "2500", "priceCurrency": "XOF" },
        { "@type": "Offer", "name": "Max",   "price": "5000", "priceCurrency": "XOF" }
      ]
    }
    </script>

    <!-- Fonts — preconnect first, then load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="manifest" href="/manifest.json" />
    <!-- Applique le thème avant toute CSS pour éviter le flash light→dark ou dark→light -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('jangalai-theme') || 'light';
          document.documentElement.setAttribute('data-theme', t);
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
